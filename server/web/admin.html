<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XTION_TheFool0 — Admin 控制面板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; font-size: 14px; }
  .header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #0f3460; }
  .header h1 { font-size: 18px; color: #e94560; }
  .conn-status { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .conn-status.online { background: #2d6a4f; color: #b7e4c7; }
  .conn-status.offline { background: #6a2d2d; color: #e4b7b7; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; max-height: calc(100vh - 56px); overflow-y: auto; }
  .panel { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 14px; }
  .panel h2 { font-size: 14px; color: #e94560; margin-bottom: 10px; border-bottom: 1px solid #0f3460; padding-bottom: 6px; }
  .panel.full-width { grid-column: 1 / -1; }

  /* Act buttons */
  .act-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .act-bar .current-act { font-size: 13px; color: #a8dadc; margin-right: 8px; white-space: nowrap; }
  .act-btn { padding: 6px 14px; border: 1px solid #0f3460; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .act-btn:hover { background: #0f3460; }
  .act-btn.active { background: #e94560; border-color: #e94560; color: #fff; }

  /* Player status */
  .player-list { display: flex; gap: 12px; flex-wrap: wrap; }
  .player-card { background: #1a1a2e; border: 1px solid #0f3460; border-radius: 6px; padding: 10px 14px; min-width: 140px; }
  .player-card .name { font-weight: 600; font-size: 14px; }
  .player-card .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .player-card .status-dot.online { background: #52b788; }
  .player-card .status-dot.offline { background: #e63946; }
  .player-card .stats { font-size: 12px; color: #a8a8a8; margin-top: 4px; line-height: 1.6; }

  /* Broadcast history */
  .msg-list { max-height: 260px; overflow-y: auto; font-size: 13px; }
  .msg-item { padding: 4px 0; border-bottom: 1px solid #0f3460; }
  .msg-item .msg-from { color: #a8dadc; font-weight: 600; }
  .msg-item .msg-time { color: #666; font-size: 11px; margin-left: 6px; }
  .msg-item .msg-text { margin-top: 2px; }
  .msg-item .proxy-tag { color: #e94560; font-size: 11px; margin-left: 4px; }

  /* Product docs */
  .product-section { margin-bottom: 10px; }
  .product-section .team-name { font-weight: 600; color: #a8dadc; margin-bottom: 4px; }
  .product-section .doc-field { font-size: 12px; color: #ccc; margin: 2px 0; }
  .product-section .doc-field span { color: #888; }

  /* Reviews */
  .review-list { font-size: 13px; }
  .review-item { padding: 6px 0; border-bottom: 1px solid #0f3460; }
  .review-item .score { color: #ffd166; font-weight: 700; }

  /* Viewer stats */
  .viewer-stats { display: flex; gap: 20px; font-size: 16px; }
  .stat-box { text-align: center; }
  .stat-box .stat-num { font-size: 28px; font-weight: 700; color: #e94560; }
  .stat-box .stat-label { font-size: 12px; color: #888; }

  /* Empty state */
  .empty { color: #555; font-style: italic; font-size: 13px; }
</style>
</head>
<body>
<div class="header">
  <h1>🦞 XTION_TheFool0 Admin</h1>
  <span id="connStatus" class="conn-status offline">未连接</span>
</div>

<div class="grid">
  <!-- Act Control -->
  <div class="panel full-width">
    <h2>🎬 幕次控制</h2>
    <div class="act-bar">
      <span class="current-act" id="currentAct">当前: 未开始 (0)</span>
    </div>
  </div>

  <!-- Player Status -->
  <div class="panel">
    <h2>🦞 选手状态</h2>
    <div class="player-list" id="playerList">
      <div class="player-card" id="player-qianzi">
        <div class="name"><span class="status-dot offline" id="dot-qianzi"></span>钳子</div>
        <div class="stats" id="stats-qianzi">mood: - | conf: - | energy: - | likes: 0</div>
      </div>
      <div class="player-card" id="player-paopao">
        <div class="name"><span class="status-dot offline" id="dot-paopao"></span>泡泡</div>
        <div class="stats" id="stats-paopao">mood: - | conf: - | energy: - | likes: 0</div>
      </div>
      <div class="player-card" id="player-jiajia">
        <div class="name"><span class="status-dot offline" id="dot-jiajia"></span>夹夹</div>
        <div class="stats" id="stats-jiajia">mood: - | conf: - | energy: - | likes: 0</div>
      </div>
    </div>
  </div>

  <!-- Viewer Stats -->
  <div class="panel">
    <h2>👥 观众互动</h2>
    <div class="viewer-stats">
      <div class="stat-box">
        <div class="stat-num" id="danmakuCount">0</div>
        <div class="stat-label">弹幕总数</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="likesTotal">0</div>
        <div class="stat-label">点赞总数</div>
      </div>
    </div>
  </div>

  <!-- Broadcast History -->
  <div class="panel">
    <h2>📢 广播历史</h2>
    <div class="msg-list" id="msgList">
      <div class="empty">暂无消息</div>
    </div>
  </div>

  <!-- Product Docs -->
  <div class="panel">
    <h2>📄 产品文档</h2>
    <div id="productDocs">
      <div class="empty">等待分组后显示</div>
    </div>
  </div>

  <!-- Reviews -->
  <div class="panel">
    <h2>⭐ 评审结果</h2>
    <div class="review-list" id="reviewList">
      <div class="empty">暂无评审</div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function() {
  'use strict';

  // --- State ---
  var currentActNum = 0;
  var danmakuTotal = 0;
  var playerLikes = { qianzi: 0, paopao: 0, jiajia: 0 };
  var productData = {};
  var reviews = [];

  // --- Act definitions ---
  var ACT_NAMES = {
    1: '自我介绍', 2: '组队偏好', 3: '分组', 4: '产品讨论',
    5: '产品打磨', 6: '人类代言', 7: 'AI 评审', 8: '颁奖',
    9: '共创画布', 10: '闭幕'
  };

  // --- DOM refs ---
  var $connStatus = document.getElementById('connStatus');
  var $currentAct = document.getElementById('currentAct');
  var $msgList = document.getElementById('msgList');
  var $danmakuCount = document.getElementById('danmakuCount');
  var $likesTotal = document.getElementById('likesTotal');
  var $productDocs = document.getElementById('productDocs');
  var $reviewList = document.getElementById('reviewList');

  // --- Create act buttons ---
  var actBar = document.querySelector('.act-bar');
  for (var i = 1; i <= 10; i++) {
    var btn = document.createElement('button');
    btn.className = 'act-btn';
    btn.textContent = i;
    btn.dataset.act = i;
    btn.title = '第' + i + '幕: ' + (ACT_NAMES[i] || '');
    btn.addEventListener('click', function() {
      var act = parseInt(this.dataset.act, 10);
      socket.emit('admin:setAct', { act: act });
    });
    actBar.appendChild(btn);
  }

  // --- Socket.io connection ---
  var socket = io({ auth: { apiKey: 'key-admin-xxx' } });

  socket.on('connect', function() {
    $connStatus.textContent = '已连接';
    $connStatus.className = 'conn-status online';
    // Query current state
    socket.emit('act:query');
  });

  socket.on('disconnect', function() {
    $connStatus.textContent = '未连接';
    $connStatus.className = 'conn-status offline';
  });

  // --- Act events ---
  socket.on('act:current', function(data) {
    updateAct(data);
  });

  socket.on('act:changed', function(data) {
    updateAct(data);
  });

  function updateAct(data) {
    if (!data) return;
    currentActNum = data.act || 0;
    var name = data.name || ACT_NAMES[currentActNum] || '';
    $currentAct.textContent = '当前: 第' + currentActNum + '幕 — ' + name;
    // Highlight active button
    var btns = document.querySelectorAll('.act-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', parseInt(btns[i].dataset.act, 10) === currentActNum);
    }
  }

  // --- Player status ---
  socket.on('player:status', function(data) {
    if (!data || !data.agentId) return;
    var dot = document.getElementById('dot-' + data.agentId);
    if (dot) {
      dot.className = 'status-dot ' + (data.status === 'online' ? 'online' : 'offline');
    }
  });

  // --- Player stats ---
  socket.on('player:statsChanged', function(data) {
    if (!data || !data.agentId) return;
    var el = document.getElementById('stats-' + data.agentId);
    if (el) {
      el.textContent = 'mood: ' + (data.mood || '-') +
        ' | conf: ' + (data.confidence != null ? data.confidence : '-') +
        ' | energy: ' + (data.energy != null ? data.energy : '-') +
        ' | likes: ' + (data.likes || 0);
    }
  });

  // --- Player likes ---
  socket.on('player:likesChanged', function(data) {
    if (!data || !data.agentId) return;
    playerLikes[data.agentId] = data.likes || 0;
    updateLikesTotal();
  });

  function updateLikesTotal() {
    var total = 0;
    for (var k in playerLikes) total += playerLikes[k];
    $likesTotal.textContent = total;
  }

  // --- Broadcast messages ---
  socket.on('msg:broadcasted', function(data) {
    if (!data) return;
    appendMessage(data);
  });

  function appendMessage(msg) {
    // Remove empty placeholder
    var empty = $msgList.querySelector('.empty');
    if (empty) empty.remove();

    var div = document.createElement('div');
    div.className = 'msg-item';
    var time = msg.time ? new Date(msg.time).toLocaleTimeString() : '';
    var proxyTag = msg.isProxy ? '<span class="proxy-tag">[人类代言]</span>' : '';
    div.innerHTML = '<span class="msg-from">' + escapeHtml(msg.from || msg.fromId || '?') + '</span>' +
      '<span class="msg-time">' + time + '</span>' + proxyTag +
      '<div class="msg-text">' + escapeHtml(msg.text || '') + '</div>';
    $msgList.appendChild(div);
    $msgList.scrollTop = $msgList.scrollHeight;
  }

  // --- Product docs ---
  socket.on('product:changed', function(data) {
    if (!data || !data.teamId) return;
    productData[data.teamId] = data;
    renderProducts();
  });

  function renderProducts() {
    var keys = Object.keys(productData);
    if (keys.length === 0) return;
    var html = '';
    for (var i = 0; i < keys.length; i++) {
      var d = productData[keys[i]];
      html += '<div class="product-section">' +
        '<div class="team-name">队伍: ' + escapeHtml(keys[i]) + ' (v' + (d.version || 0) + ')' +
        (d.lockedAt ? ' 🔒' : '') + '</div>' +
        '<div class="doc-field"><span>名称:</span> ' + escapeHtml(d.name || '-') + '</div>' +
        '<div class="doc-field"><span>问题:</span> ' + escapeHtml(d.problem || '-') + '</div>' +
        '<div class="doc-field"><span>方案:</span> ' + escapeHtml(d.solution || '-') + '</div>' +
        '<div class="doc-field"><span>功能:</span> ' + escapeHtml(d.features || '-') + '</div>' +
        '</div>';
    }
    $productDocs.innerHTML = html;
  }

  // --- Reviews ---
  socket.on('review:new', function(data) {
    if (!data) return;
    reviews.push(data);
    renderReviews();
  });

  function renderReviews() {
    if (reviews.length === 0) return;
    var html = '';
    for (var i = reviews.length - 1; i >= 0; i--) {
      var r = reviews[i];
      html += '<div class="review-item">' +
        '<span class="score">' + (r.score || '?') + '/10</span> — ' +
        '队伍: ' + escapeHtml(r.teamId || '?') +
        ' | ' + escapeHtml(r.reason || '') +
        '</div>';
    }
    $reviewList.innerHTML = html;
  }

  // --- Danmaku count ---
  socket.on('danmaku', function() {
    danmakuTotal++;
    $danmakuCount.textContent = danmakuTotal;
  });

  // --- Product locked ---
  socket.on('product:locked', function(data) {
    if (!data || !data.teamId) return;
    if (productData[data.teamId]) {
      productData[data.teamId].lockedAt = Date.now();
      renderProducts();
    }
  });

  // --- Utility ---
  function escapeHtml(str) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }
})();
</script>
</body>
</html>
